<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | GARAGEM</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<header>
    <nav class="container">
        <a href="/" class="logo">GARAGEM<span>.</span></a>
        <a href="/#catalogo" class="menu-link">Ver veículos</a>
    </nav>
</header>

<main class="container auth-area">
    <section class="auth-card">
        <p class="destaque">BEM-VINDO DE VOLTA</p>
        <h1>Entre na sua conta</h1>

        <p class="auth-descricao">
            Acesse sua conta na GARAGEM.
        </p>

        <form id="form-login">
            <label for="email">E-mail</label>
            <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    autocomplete="username"
                    required
            >

            <label for="senha">Senha</label>
            <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
            >

            <button type="submit" class="botao auth-botao">
                Entrar
            </button>

            <p id="mensagem-auth" class="mensagem-auth"
               role="status" aria-live="polite"></p>
        </form>

        <p class="auth-rodape">
            Ainda não tem uma conta?
            <a href="/cadastro.html">Cadastre-se</a>
        </p>
    </section>
</main>

<footer>
    <div class="container">
        <p>GARAGEM — Loja de Veículos</p>
        <p>Encontre seu próximo carro.</p>
    </div>
</footer>

<script src="/js/auth.js"></script>

</body>
</html>
