spring.application.name=logs-api
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/loja_logs
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=15.228.215.36
spring.rabbitmq.port=5672
spring.rabbitmq.username=aluno
spring.rabbitmq.password=12345
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=5s

app.rabbitmq.fila=emanuel

spring.rabbitmq.listener.simple.acknowledge-mode=auto
